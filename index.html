<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MathBot AI - Future of Learning</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind Config -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Rajdhani', 'sans-serif'],
              display: ['Orbitron', 'sans-serif'],
            },
            colors: {
              neon: {
                blue: '#00f3ff',
                purple: '#bc13fe',
                green: '#0aff68',
              }
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'pulse-glow': 'pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'spin-slow': 'spin 3s linear infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              'pulse-glow': {
                '0%, 100%': { opacity: 1, boxShadow: '0 0 20px #00f3ff' },
                '50%': { opacity: .5, boxShadow: '0 0 10px #bc13fe' },
              }
            }
          },
        },
      }
    </script>
    
    <!-- Custom Styles -->
    <style>
      body {
        background-color: #050510;
        color: #fff;
        overflow-x: hidden;
        margin: 0;
        padding: 0;
      }
      
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f0f2d;
      }
      ::-webkit-scrollbar-thumb {
        background: #bc13fe;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #9c10ce;
      }

      /* Loading animation */
      .loader {
        border: 3px solid #f3f3f3;
        border-top: 3px solid #00f3ff;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  
  <body>
    <!-- Root element where React app will mount -->
    <div id="root"></div>
    
    <!-- Vite will inject the bundled JS here during build -->
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
